[program:ml_service]
directory=/var/www/machine_learning
command=/var/www/machine_learning/venv/bin/gunicorn -w 2 -b 127.0.0.1:5000 api_ml:app --access-logfile - --error-logfile -
user=vps-comp
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/ml_service.err.log
stdout_logfile=/var/log/ml_service.out.log
environment=PATH="/var/www/machine_learning/venv/bin"

